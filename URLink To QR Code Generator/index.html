<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
       <p>Enter your text or URL</p>
       <input id="qrText" type="text" placeholder="Text or URL">
       <button onclick="generateOR()">Generate OR Code</button>
       
       <!-- Move imgBox inside container -->
       <div id="imgBox" class="imgBox">
          <img src="" id="qrImage">
       </div>
    </div>
 
    <script>
       const api_url = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=";
 
       let imgBox = document.getElementById("imgBox");
       let qrImage = document.getElementById("qrImage");
       let qrText = document.getElementById("qrText");
 
       function generateOR() {
           if (qrText.value.length > 0) {
               qrImage.src = api_url + encodeURIComponent(qrText.value); // Encode input
               imgBox.classList.add("show-img");
           } else {
               qrText.classList.add('error');
               setTimeout(() => {
                   qrText.classList.remove('error');
               }, 1000);
           }
       }
    </script>
 </body>
